  <path d="M148 128 L160 116 L172 128" stroke="#2C3746" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M160 116 L160 150" stroke="#2C3746" stroke-width="2.5" stroke-linecap="round"/>
