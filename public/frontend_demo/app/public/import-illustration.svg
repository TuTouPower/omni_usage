  </g>
  <g transform="rotate(0 160 48)">
    <rect x="132" y="22" width="56" height="40" rx="6" stroke="#C6F63D" stroke-width="2"/>
    <text x="160" y="47" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#C6F63D">.md</text>
  </g>
  <g transform="rotate(12 224 60)">
