appId: com.omnipanel.app
productName: OmniPanel
directories:
    output: artifacts
files:
    - out/**
    - package.json
    # better-sqlite3's runtime JS deps ('bindings', 'file-uri-to-path') are
    # dropped from the dependency collection under the pnpm hoisted layout;
    # include them explicitly so utilityProcess children (query worker /
    # collector) can load the native addon from app.asar.unpacked.
    - node_modules/bindings/**
    - node_modules/file-uri-to-path/**
extraResources:
    - from: connectors
      to: connectors
    - from: assets/tray-icon.png
      to: tray-icon.png
    - from: assets/icon.png
      to: icon.png
    - from: out/web
      to: web
      filter: ["**/*"]
asar: true
asarUnpack:
    - out/main/collector.js
    - out/main/query-worker.js
    - out/main/chunks/**
    # better-sqlite3 lives unpacked (native addon); its runtime JS deps
    # 'bindings' + 'file-uri-to-path' must sit beside it, or utilityProcess
    # children (query worker / collector) fail require() when opening the store.
    - node_modules/bindings/**
    - node_modules/file-uri-to-path/**
electronFuses:
    enableEmbeddedAsarIntegrityValidation: true
    onlyLoadAppFromAsar: true
    runAsNode: false
    enableCookieEncryption: true
    enableNodeOptionsEnvironmentVariable: false
    enableNodeCliInspectArguments: false
win:
    target:
        - target: nsis
          arch: [x64]
    icon: assets/icon.ico
nsis:
    oneClick: false
    perMachine: false
    allowToChangeInstallationDirectory: true
mac:
    target:
        - target: dmg
          arch: [x64, arm64]
        - target: zip
          arch: [x64, arm64]
    icon: assets/icon.png
    hardenedRuntime: true
linux:
    target:
        - AppImage
        - deb
        - rpm
    icon: assets/icon.png
