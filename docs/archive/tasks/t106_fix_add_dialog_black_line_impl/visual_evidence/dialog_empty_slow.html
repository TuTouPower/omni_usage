<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
:root {
  --win-bg: #ffffff;
  --win-border: rgba(0,0,0,0.12);
  --win-shadow: 0 20px 60px rgba(0,0,0,0.18);
  --hairline: rgba(0,0,0,0.08);
  --text: #111111;
  --text-3: #888888;
}
body {
  margin: 0;
  background: #f0f0f0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.acct-dialog {
    width: 100%;
    max-width: 372px;
    background: var(--win-bg);
    border: 0.5px solid var(--win-border);
    border-radius: 16px;
    box-shadow: var(--win-shadow);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    animation: dialogIn 0.16s cubic-bezier(0.2, 0.8, 0.3, 1);
    animation-fill-mode: backwards;
}
@keyframes dialogIn {
    from {
        opacity: 0;
        border-color: transparent;
        box-shadow: none;
        transform: translateY(8px) scale(0.98);
    }
    to {
        opacity: 1;
        border-color: var(--win-border);
        box-shadow: var(--win-shadow);
        transform: none;
    }
}
.ad-head {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 16px 16px 14px;
    border-bottom: 0.5px solid var(--hairline);
}
.ad-htext {
.acct-dialog {
  min-height: 80px;
  animation-duration: 10s !important;
}
</style>
</head>
<body>
<div class="acct-dialog"></div>
</body>
</html>
